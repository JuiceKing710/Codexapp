<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Zeb's OBD AI</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #0b1724 0%, #15324a 100%);
        color: #f8fafc;
      }

      main {
        width: min(28rem, calc(100vw - 2rem));
        padding: 1.5rem;
        border-radius: 1.25rem;
        background: rgba(11, 23, 36, 0.86);
        border: 1px solid rgba(148, 163, 184, 0.28);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        line-height: 1.5;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, SFMono-Regular, monospace;
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Zeb's OBD AI</h1>
      <p id="status">
        Native shell is installed. Set <code>ZebDashboardURL</code> in the iOS
        app target to a reachable FastAPI dashboard URL, then relaunch the app.
      </p>
    </main>
    <script>
      const status = document.getElementById("status");
      const bootstrap = window.ZebRuntimeConfig || {};
      if (bootstrap.dashboardUrl) {
        status.textContent = "Opening the shared dashboard runtime...";
        window.location.replace(bootstrap.dashboardUrl);
      }
    </script>
  </body>
</html>
